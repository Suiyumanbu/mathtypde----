name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate release layout
        run: python tools/validate_release.py

      - name: Validate PowerShell, C#, and manifest handling
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Build release bundle
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: mathtype-word-release
          path: dist/*
          if-no-files-found: error
